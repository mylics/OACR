[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oacr"
version = "0.1.0"
description = "Outcome-Anchored Credit Reallocation for agentic KGQA."
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "fastapi>=0.115",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "torch==2.8.0",
  "transformers>=4.46,<5",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
